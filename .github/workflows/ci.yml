name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ty check
      # Two branches autogenerating off the same base merge cleanly in git but leave
      # multiple Alembic heads, which kills the prod container's `upgrade head` at
      # start — fail here instead.
      - name: Single Alembic head
        run: |
          heads="$(uv run python -m alembic heads)"
          echo "$heads"
          test "$(echo "$heads" | wc -l)" -eq 1
      - run: uv run python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run verify
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
