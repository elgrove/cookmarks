services:
  cookmarks:
    build:
      context: .
      dockerfile: Dockerfile
    image: cookmarks-v2
    ports:
      # host:container — FastAPI serves the API and the SPA on a single origin.
      - "8789:8789"
    volumes:
      # SQLite DB, embeddings and the internal Redis dump live here.
      - ./data:/data
      # Optional: mount a Calibre library to enable book sync.
      # - /path/to/calibre-all:/calibre:ro
    environment:
      COOKMARKS_ENV: prod
      COOKMARKS_DB_PATH: /data/db.sqlite3
      COOKMARKS_FRONTEND_DIST: /app/static/frontend
      # Internal Redis (managed by s6 inside the container).
      COOKMARKS_CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      COOKMARKS_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      # Uncomment alongside the volume above to point at the mounted library.
      # COOKMARKS_CALIBRE_LIBRARY_PATH: /calibre
    restart: unless-stopped
