services:
  cookmarks:
    build:
      context: .
      dockerfile: Dockerfile
    image: cookmarks-v2
    ports:
      - "8789:8789"
    volumes:
      - ./data:/data
      # The Calibre library covers, EPUBs, recipe images and extraction all read
      # from. Point COOKMARKS_CALIBRE_LIBRARY at the host library (in .env or the
      # environment); it mounts read-only at the in-container path the app expects.
      - ${COOKMARKS_CALIBRE_LIBRARY:-./calibre-library}:/library:ro
    environment:
      - COOKMARKS_CALIBRE_LIBRARY_PATH=/library
      # Optional: enables the footer "Submit a ticket" link, which files issues into
      # the Cookmarks Linear project. The link stays hidden until the key + team are set.
      - COOKMARKS_LINEAR_API_KEY=${COOKMARKS_LINEAR_API_KEY:-}
      - COOKMARKS_LINEAR_TEAM_ID=${COOKMARKS_LINEAR_TEAM_ID:-}
      - COOKMARKS_LINEAR_PROJECT_ID=${COOKMARKS_LINEAR_PROJECT_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8789/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
