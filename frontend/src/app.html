<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Resolve the theme before first paint so there is no light-mode flash.
			// Mirrors theme.ts: a stored preference wins; otherwise follow the OS.
			(function () {
				try {
					var pref = localStorage.getItem('cookmarks-theme');
					var dark =
						pref === 'dark' ||
						((!pref || pref === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					/* localStorage/matchMedia unavailable — fall through to light */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
