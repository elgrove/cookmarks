[project]
name = "cookmarks-backend"
version = "0.2.0"
description = "Cookmarks v2 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "celery>=5.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
