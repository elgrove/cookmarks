[project]
name = "cookmarks-backend"
version = "0.2.0"
description = "Cookmarks v2 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlite-vec>=0.1.6",
    "httpx>=0.28",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "lxml>=6.0.2",
    "google-genai>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]
eval = [
    "rapidfuzz>=3.10",
]

[tool.uv]
# Sync the eval group by default so `make check`/`make test` can typecheck and run
# the eval suite. The eval suite itself is dev tooling, not a runtime dependency.
default-groups = ["dev", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# The deduplication prompt deliberately includes a non-breaking hyphen as an
# example of a keyword variant to be normalised; keep the proven prompt verbatim.
"app/services/prompts.py" = ["RUF001"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
